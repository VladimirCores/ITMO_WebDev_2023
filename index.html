<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <title>Frontend Mentor | Intro section with dropdown navigation</title>
  </head>
  <!--  https://dribbble.com/shots/18048975-Project-Management-Dashboard-->
  <body class="h-screen h-screen bg-teal-900/20 p-12">
    <div class="flex h-full w-full flex-row rounded-3xl bg-gray-100 p-4">
      <aside class="flex w-[377px] flex-col px-2 py-8">
        <div class="flex flex-row">Logo Taski</div>
        <div class="flex flex-row">Account</div>
        <div class="flex flex-row">Pages</div>
        <div class="flex flex-row">Labels</div>
      </aside>
      <div class="flex w-full flex-col justify-between gap-y-4 rounded-2xl bg-white px-6 pt-8">
        <header class="flex flex-row justify-between">
          <div class="flex flex-col">Team tasks</div>
          <div class="flex flex-col">
            <div class="flex flex-row gap-x-4">
              <div>Search</div>
              <div><button>Create task</button></div>
            </div>
          </div>
        </header>
        <main class="flex h-full flex-row">
          <div class="flex w-full flex-col gap-y-4">
            <div class="flex flex-row">Filters</div>
            <div class="grid w-full grid-cols-3 gap-x-4">
              <div class="flex flex-col gap-y-2 rounded-xl bg-gray-100 p-4">
                <div class="flex flex-row">Todo 2 + ...</div>
                <div class="flex flex-row">
                  <div class="flex w-full flex-col rounded-xl bg-white p-3">
                    <div class="flex">Layout Design ...</div>
                    <div class="flex">Update Web icon 12 days left</div>
                    <div class="flex">Assignees</div>
                  </div>
                </div>
                <div class="flex flex-row"><button>+ Add task</button></div>
              </div>
              <div class="flex flex-col gap-y-2 rounded-xl bg-gray-100 p-4">In progress</div>
              <div class="flex flex-col gap-y-2 rounded-xl bg-gray-100 p-4">Ready</div>
            </div>
          </div>
        </main>
        <footer class="flex flex-row">Footer</footer>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
