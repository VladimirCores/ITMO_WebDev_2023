<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />

    <title>Frontend Mentor | Intro section with dropdown navigation</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body class="bg-amber-50/10 h-screen">
    <div class="flex flex-col sm:p-6 h-full justify-between">
      <header class="hidden sm:flex flex-row justify-between items-center color-gray-500">
        <div class="flex flex-col">
          <nav class="flex p-6 sm:p-0 flex-row items-center">
            <span class="flex flex-col">
              <img src="/images/logo.svg" />
            </span>
            <span class="flex flex-col ml-8 md:ml-16">
              <ul class="flex flex-row list-none gap-x-8">
                <li class="group hover:color-dark-100 relative">
                  <a href="javascript:void(0);">
                    <div class="flex flex-row items-center gap-x-2">
                      <span>Features</span>
                      <span class="group-focus-within:hidden">
                        <img src="/images/icon-arrow-down.svg" />
                      </span>
                      <span class="hidden group-focus-within:block">
                        <img src="/images/icon-arrow-up.svg" />
                      </span>
                    </div>
                  </a>
                  <div
                    class="absolute top-8 right-0 w-38 invisible origin-top-right scale-95 transform opacity-0 transition-all duration-300 group-focus-within:visible group-focus-within:translate-y-0 group-focus-within:scale-100 group-focus-within:opacity-100"
                  >
                    <div
                      class="px-5 py-4 rounded-md border border-gray-200 bg-white shadow-lg"
                      role="menu"
                    >
                      <div class="flex flex-col gap-y-4 items-start">
                        <a class="flex flex-row gap-x-4" href="javascript:void(0);" role="menuitem">
                          <img class="object-contain w-4" src="public/images/icon-todo.svg" />
                          <span>Todo List</span>
                        </a>
                        <a class="flex flex-row gap-x-4" href="javascript:void(0);" role="menuitem">
                          <img class="object-contain w-4" src="public/images/icon-calendar.svg" />
                          <span>Calendar</span>
                        </a>
                        <a class="flex flex-row gap-x-4" href="javascript:void(0);" role="menuitem">
                          <img class="object-contain w-4" src="public/images/icon-reminders.svg" />
                          <span>Reminders</span>
                        </a>
                        <a class="flex flex-row gap-x-4" href="javascript:void(0);" role="menuitem">
                          <img class="object-contain w-4" src="public/images/icon-planning.svg" />
                          <span>Planning</span>
                        </a>
                      </div>
                    </div>
                  </div>
                </li>
                <li class="hover:color-dark-100">
                  <a href="/#"
                    ><div class="flex flex-row items-center gap-x-2">
                      <span>Company</span>
                      <span><img src="/images/icon-arrow-down.svg" /></span></div
                  ></a>
                </li>
                <li class="hover:color-dark-100">
                  <a href="/#">Careers</a>
                </li>
                <li class="hover:color-dark-100">
                  <a href="/#">About</a>
                </li>
              </ul>
            </span>
          </nav>
        </div>
        <div class="flex flex-col">
          <div class="flex flex-row gap-x-8">
            <button class="hover:color-dark-100">
              <span class="hover:hover:color-dark-100">Login</span>
            </button>
            <button class="border-1 border-gray-500 rounded-xl py-2 px-4">
              <span class="hover:hover:color-dark-100">Register</span>
            </button>
          </div>
        </div>
      </header>
      <header class="group/menu block relative sm:hidden w-full h-screen">
        <div class="flex flex-row p-6 justify-between items-center">
          <span class="flex flex-col">
            <img src="/images/logo.svg" />
          </span>
          <button class="flex flex-col">
            <img src="/images/icon-menu.svg" />
          </button>
        </div>
        <menu
          class="group-focus-within/menu:block hidden absolute w-screen h-screen bg-dark-100/80 top-0"
        >
          <div class="absolute h-screen w-70% bg-white right-0"></div>
        </menu>
      </header>
      <main class="flex flex-row sm:container sm:mx-auto">
        <div class="flex flex-col justify-center">
          <div class="flex flex-col sm:flex-row sm:gap-x-12">
            <div
              class="flex order-2 px-6 ms:px-0 sm:order-1 flex-col h-full sm:w-50% gap-y-12 md:gap-y-0 justify-between"
            >
              <div class="flex flex-row h-full items-center">
                <div
                  class="flex text-center sm:text-left flex-col gap-y-12 items-center sm:items-start"
                >
                  <h1 class="font-bold text-6xl">Make remote work</h1>
                  <p class="text-sm leading-5 color-gray-700 sm:max-w-80">
                    Get your team in sync, no matter your location. Streamline processes, create
                    team rituals, and watch productivity soar.
                  </p>
                  <button
                    class="rounded-xl border-1 border-gray-500 bg-black px-5 py-2 hover:bg-transparent color-white hover:color-dark-100"
                  >
                    <span class="font-bold">Learn more</span>
                  </button>
                </div>
              </div>
              <div
                class="flex flex-row justify-center sm:justify-start sm:items-end gap-x-8 gap-y-6 w-full flex-wrap"
              >
                <img class="h-4 lg:h-5" src="/images/client-databiz.svg" />
                <img class="h-4 lg:h-5" src="/images/client-audiophile.svg" />
                <img class="h-4 lg:h-5" src="/images/client-meet.svg" />
                <img class="h-4 lg:h-5" src="/images/client-maker.svg" />
              </div>
            </div>
            <div class="flex order-1 sm:order-2 mb-6 sm:mb-0 flex-col sm:w-50% justify-center">
              <div class="flex flex-row h-full sm:max-sm:w-full max-h-180">
                <img class="object-contain hidden sm:block" src="/images/image-hero-desktop.png" />
                <img class="object-contain sm:hidden" src="/images/image-hero-mobile.png" />
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer class="flex flex-row justify-center attribution">
        Challenge by
        <a href="https://www.frontendmentor.io" target="_blank">Frontend Mentor</a>. Coded by
        <a href="#">Vladimir Minkin</a>.
      </footer>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
