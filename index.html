<!DOCTYPE html>
<html lang="ru_RU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <title>Frontend Mentor | Intro section with dropdown navigation</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap');

      @tailwind base;
      @tailwind components;
      @tailwind utilities;

      body * {
        font-family: 'Epilogue', sans-serif;
      }

      @layer components {
        .btn-register {
          @apply border-2 border-gray-500 rounded-lg px-3 py-1.5 hover:text-black;
        }
        .btn-learnmore {
          @apply bg-black text-white px-5 py-3 rounded-lg;
        }
      }
    </style>
  </head>
  <body class="flex flex-col h-screen">
    <header class="flex flex-row justify-between items-center px-6 py-4">
      <div class="flex flex-col">
        <div class="flex flex-row gap-x-8">
          <img src="public/logo.svg" />
          <nav class="hidden sm:flex flex-row items-center gap-x-6">
            <div class="flex flex-row gap-x-2 items-center hover:text-black">
              <div class="font-bold text-neutral-500">Features</div>
              <img src="./public/icon-arrow-down.svg" />
            </div>
            <div class="font-bold text-neutral-500 hover:text-black">Company</div>
            <div class="font-bold text-neutral-500 hover:text-black">Careers</div>
            <div class="font-bold text-neutral-500 hover:text-black">About</div>
          </nav>
        </div>
      </div>
      <div class="hidden sm:flex flex-col">
        <div class="flex flex-row gap-x-4 items-center">
          <div class="hover:text-black">Login</div>
          <div class="btn-register">Register</div>
        </div>
      </div>
      <div class="flex sm:hidden">
        <img src="public/icon-menu.svg" />
      </div>
    </header>
      <main class="container mx-auto flex sm:h-full flex-col sm:flex-row">
        <div class="flex flex-col order-1 sm:order-0 sm:w-1/2 justify-between  p-8 sm:p-0">
          <div class='flex flex-row sm:h-full'>
            <div class='flex flex-col items-center sm:justify-center sm:items-start gap-y-12'>
              <div class='text-6xl font-bold text-center sm:text-left'>Make remote work</div>
              <div class='text-lg text-neutral-600 text-center sm:text-left'>
                Get your team in sync, no matter your location. Streamline processes, create team
                rituals, and watch productivity soar.
              </div>
              <div class='btn-learnmore'>
                Learn more
              </div>
            </div>
          </div>
          <div class='flex flex-row w-full flex-wrap justify-start gap-y-4 gap-x-4 pt-12 sm:p-0'>
            <img class='h-6' src='./public/client-databiz.svg'>
            <img class='h-6' src='./public/client-audiophile.svg'>
            <img class='h-6' src='./public/client-maker.svg'>
            <img class='h-6' src='./public/client-meet.svg'>
          </div>
        </div>
        </div>
        <div class="flex flex-col order-0 h-56 sm:order-1 sm:w-1/2 sm:h-full justify-center overflow-hidden">
            <img class='w-full object-cover' src='./public/image-hero-desktop.png' />
        </div>
      </main>
  </body>
</html>
