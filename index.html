<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome App</title>
  </head>
  <body>
    <header>Header <span>Linear</span></header>
    <main>
      <aside>Sidebar</aside>
