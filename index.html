<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <title>Frontend Mentor | Product preview card component</title>
    <!--    https://codepen.io/vladimir-minkin/pen/poOZawR-->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&family=Sofia+Sans+Extra+Condensed:wght@300&display=swap');
      html {
        background-color: hsl(30, 38%, 92%);
        font-size: 12px;
      }
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
      }
      .flex-half-column {
        flex: 1;
      }
      .card {
        display: flex;
        flex-direction: row;

        width: 655px;
        background: white;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
      }
      .card-content-wrapper {
        padding: 2.5rem;
      }
      .card-content-wrapper > *:not(:last-child) {
        margin-top: 0;
        margin-bottom: 2rem;
      }
      .cart-content_name {
        font-family: 'Montserrat', sans;
        font-size: 1rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: #888;
      }
      .cart-content_title {
        font-family: 'Fraunces', sans;
        font-size: 2.75rem;
        font-weight: 700;
        line-height: 1.1;
        color: #222;
      }
      .cart-content_text {
        font-family: 'Montserrat', sans;
        font-size: 1.15rem;
        font-weight: 500;
        line-height: 1.5;
        color: #666;
      }
      .cart-content_prise {
        display: flex;
        flex-direction: row;
        align-items: center;
      }
      .cart-content_prise-current {
        font-family: 'Fraunces', sans;
        font-size: 2.75rem;
        font-weight: 700;
        line-height: 1;
        color: hsl(158, 36%, 37%);
      }
      .cart-content_prise-previous {
        padding: 0 0 0 1rem;
        font-family: 'Montserrat', sans;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1;
        color: #888;
      }
      .cart-content_btn-buy {
        font-family: 'Montserrat', sans-serif;
        background: hsl(158, 36%, 37%);
        width: 100%;
        outline: 0;
        border: 0;
        padding: 1.25rem 0;
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: 500;
        border-radius: 0.75rem;
      }

      .img-data {
        width: 100%;
        height: 100%;
        background-color: lightblue;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-image: url('public/images/image-product-desktop.jpg');
      }

      @media (max-width: 750px) {
        .card {
          display: flex;
          flex-direction: column;
          width: 355px;
        }
        .img-data {
          width: 100%;
          height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="flex-half-column">
        <div class="img-data"></div>
      </div>
      <div class="flex-half-column card-content">
        <div class="card-content-wrapper">
          <p class="cart-content_name">Perfume</p>
          <h1 class="cart-content_title">Gabrielle Essence Eau De Parfum</h1>
          <p class="cart-content_text">
            A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="cart-content_prise">
            <span class="cart-content_prise-current">$149.99</span>
            <span class="cart-content_prise-previous"><s>$169.99</s></span>
          </div>
          <button class="cart-content_btn-buy">Add to Cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
